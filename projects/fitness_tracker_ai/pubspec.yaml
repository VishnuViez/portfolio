name: fitness_tracker_ai
description: AI-powered fitness tracker with workout recommendations and progress analytics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  http: ^1.2.0
  intl: ^0.20.1
  shared_preferences: ^2.2.2
  uuid: ^4.5.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
